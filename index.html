<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'Lato',sans-serif;min-height:100vh}
body.standalone{display:flex;align-items:center;justify-content:center;padding:16px;background:linear-gradient(135deg,#083a46 0%,#0b7181 55%,#1ab2b1 100%)}
body.embedded{background:transparent;padding:0}
#root{width:100%;display:flex;justify-content:center}
@keyframes bounce{0%,80%,100%{transform:translateY(0)}40%{transform:translateY(-6px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-thumb{background:#c0d8db;border-radius:4px}
.chip{border:1.5px solid #1ab2b1;background:#fff;color:#083a46;border-radius:20px;padding:8px 14px;font:700 13px Lato,sans-serif;cursor:pointer;transition:all .15s}
.chip:hover{background:#e6f5f5}
.typebtn{flex:1;padding:14px 10px;border-radius:12px;border:2px solid #d4e4e6;background:#fff;color:#3d6b74;font:700 14px Lato,sans-serif;cursor:pointer;transition:all .2s;text-align:left}
.typebtn small{display:block;font-weight:400;font-size:12px;margin-top:3px;color:#5d8790}
.typebtn.on{border-color:#1ab2b1;background:#e6f5f5;color:#083a46}
</style>

    s.push("If the client says the property is let out or buy to let: explain that " + L.name + " buy to let mortgages are handled by " + b.name + ", record lender as " + b.name + ", treat the mortgage as BUY TO LET, and carry on. You may give this link once: " + site + L.btlGoTo + "/");
  }
  if (L && L.lends === 'btl' && L.resiGoTo && window.PP_LENDERS[L.resiGoTo]) {
    var r = window.PP_LENDERS[L.resiGoTo];
    s.push("If the client says it is their own home, not a let property: explain residential mortgages in this group are with " + r.name + ", record lender as " + r.name + ", treat it as RESIDENTIAL, and carry on.");
  }
  s.push("");
  s.push("QUICK REPLIES: when the answer is a choice, end your message with one line: [[options: A | B | C]] (max 8 short options). The page shows them as buttons. The client can still type.");
  s.push("PROGRESS: end EVERY message with [[progress: N]] where N is 0 to 100, your estimate of how far through the fact find we are.");
  s.push("");
  s.push("STAGE 1, in this exact order, one question at a time:");
  s.push("1) First name.");
  s.push("2) When their current deal ends. Ask for month and year. Offer quick replies: 'Already ended', the next 6 calendar months from today written like 'Jan 2027', 'Other date', 'Not sure'. If 'Other date', ask which month and year exactly, with no buttons, then give the timing line. If 'Not sure', say it is on their annual mortgage statement or lender letters, and a rough month is fine.");
  s.push("   Straight after they answer, give ONE short timing line, then move on:");
  if (L) {
    s.push("   - Deal already ended: they are probably on " + L.name + "'s revert rate now, so we will move quickly.");
    s.push("   - Deal ends within the booking window (" + L.window + "): good news, we can secure their new " + L.name + " rate now.");
    s.push("   - Deal ends later than that: say plainly that " + L.name + " doesn't offer a " + L.pt + " for you just yet, as they only let us book " + L.window + ". Reassure them we'll keep their details, get everything ready and contact them as soon as the window opens, then carry on.");
  } else {
    s.push("   - Deal already ended: they are probably on their lender's revert rate now, so we will move quickly.");
    s.push("   - Within about 4 months: most lenders let us secure a new rate now.");
    s.push("   - Later than about 4 months: say their lender probably doesn't offer a switch just yet, as most only let us book 3 to 6 months ahead. Reassure them we'll keep their details and contact them as soon as the window opens, then carry on.");
  }
  s.push("3) Surname.");
  s.push("4) Mobile or phone number.");
  s.push("5) Email address.");
  s.push("6) House number or name AND postcode together. A UK postcode looks like YO30 4AG or LS1 4BR. If either part is missing or the postcode looks wrong, ask again kindly. Do not move on without both.");
  s.push("CHECKPOINT: then say: 'Thanks [first name], that's your details safely noted. Can I ask a few quick questions about the mortgage? Two minutes, tops.' with [[options: Yes, carry on | Not now]].");
  s.push("On that SAME checkpoint message add one hidden line: [[lead: {\"firstName\":\"\",\"lastName\":\"\",\"phone\":\"\",\"email\":\"\",\"address\":\"\",\"postcode\":\"\",\"dealExpiry\":\"\"}]] filled in from their answers.");
  s.push("If they choose not now: thank them, say an adviser will call within one working day, give 01904 866 100, then on your next message output the FINAL JSON (below) with what you have.");
  s.push("");
  s.push("STAGE 2, one question at a time, in this order. Skip anything already known.");
  if (!mtype) s.push("a) Is the mortgage on their own home, or a property they let out? [[options: My home | A let property (buy to let)]]");
  if (!L) s.push("b) Who is the mortgage with? If the lender has buy to let and residential arms (e.g. Nationwide and The Mortgage Works, Halifax and BM Solutions), record the right one.");
  s.push("c) Rough mortgage balance left. An estimate is fine.");
  s.push("d) Rough property value. An estimate is fine.");
  s.push("d2) BUY TO LET ONLY: monthly rent the property brings in. Always ask this, an estimate is fine.");
  s.push("e) Route. Work out the last day of their deal-end month against today. Under 8 weeks away: say a " + (L ? L.pt : 'product transfer') + " is the right route as there is not time for a full remortgage; path = PT_ONLY. More than 8 weeks away: explain our product transfer service looks only at their current lender's deals and costs them nothing (no broker fee, no solicitors). If they would like a full market review across our panel of over 60 lenders, we can do that on request through our residential mortgage service, which has a £495 fee that an adviser explains before they decide. [[options: Just switch with my lender | I'd like a full market review]]. Set path = PT_ONLY or REMORTGAGE. Never say 'whole of market'.");
  s.push("f) Is the mortgage in joint names? [[options: Just me | Joint]]. If joint: the other person's full name, then phone, then email.");
  s.push("g) Any changes planned with the switch? [[options: No changes | Borrow more | Change the term | Someone coming off | Something else]]. Note it. Lenders usually handle these separately, an adviser will explain.");
  if (L && L.extras && L.extras.length) {
    s.push("h) " + L.name + " details. Explain in one line that these let us find their account and save them chasing later, and that it is fine if they do not have them to hand. Then ask for each, one at a time, each with [[options: Don't have it to hand]]:");
    for (var i = 0; i < L.extras.length; i++) s.push("   - " + L.extras[i]);
  } else {
    s.push("h) Their mortgage account number, if they have it to hand (fine if not) [[options: Don't have it to hand]]. Then their date of birth (many lenders need it to find the account).");
  }
  s.push("i) Fixed rate or tracker? [[options: Fixed | Tracker | Not sure, advise me]]");
  s.push("j) RESIDENTIAL ONLY: the most they would be comfortable paying each month.");
  s.push("j) BUY TO LET ONLY, in order: if rent is over £2,000 a month, single let or HMO [[options: Single let | HMO]]; full address of the let property; held personally or in a limited company [[options: Personally | Limited company]].");
  s.push("k) REMORTGAGE path and RESIDENTIAL only: total household income (ballpark fine), then any credit cards, loans or car finance (yes or no is fine), then years left on the mortgage.");
  s.push("k) REMORTGAGE path and BUY TO LET: years left on the mortgage.");
  s.push("");
  s.push("CLOSING:");
  s.push("PT_ONLY: 'Brilliant. Because you're staying with " + (L ? L.name : 'your lender') + ", there's no broker fee from Pinpoint, no valuation fee and no solicitors. An adviser will be in touch within one working day with your options. Anything you'd like to ask before I wrap up?'");
  s.push("REMORTGAGE: 'Perfect. An adviser will look at your " + (L ? L.name : 'current lender') + " options and run a full market review across our panel of over 60 lenders. That is our residential mortgage service, which has a £495 fee, and they'll explain it before you decide. They'll be in touch within one working day. Anything you'd like to ask before I wrap up?'");
  s.push("Answer any question briefly (no advice or rates). When they are done, say a warm goodbye with their first name.");
  s.push("In the JSON set dealInWindow to 'yes' if the switch can be booked now, 'not yet' if the deal ends beyond the booking window.");
  s.push("FINAL JSON: only AFTER the goodbye, on your very next message, output ONLY this JSON and nothing else:");
  s.push('{"complete":true,"data":{"firstName":"","lastName":"","phone":"","email":"","address":"","postcode":"","dealExpiry":"","mortgageType":"","lender":"","accountNumber":"","dateOfBirth":"","otherLenderDetails":"","balance":"","propertyValue":"","path":"","jointNames":"","jointName":"","jointPhone":"","jointEmail":"","plannedChanges":"","productType":"","maxPayment":"","rentalIncome":"","dealInWindow":"","propertyType":"","btlAddress":"","ownership":"","income":"","commitments":"","term":"","stoppedEarly":""}}');
  return s.join('\n');
};

// Send a lead to the CRM webhook, if one is set.
window.ppSend = function (event, data) {
  if (!window.PP_WEBHOOK) return;
  var ctx = window.PP_CTX;
  try {
    fetch(window.PP_WEBHOOK, { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ event: event, page: ctx.slug || 'general', lender: ctx.lender ? ctx.lender.name : '', sentAt: new Date().toISOString(), data: data }) });
  } catch (e) {}
};
</script>

<script type="text/babel">
var useState = React.useState, useRef = React.useRef, useEffect = React.useEffect;
var N = '#083a46', T = '#1ab2b1', C = '#f4f2e8', M = '#3d6b74';
var CTX = window.PP_CTX;
var ACC = (CTX.lender && CTX.lender.colour) || T;

function Logo(p) {
  return <img src={window.PP_ICON} alt="Pinpoint" style={{width: p.sz, height: p.sz, borderRadius: Math.round(p.sz * 0.26), objectFit: 'cover', flexShrink: 0, display: 'block'}} />;
}

// Pull [[options: ...]], [[progress: N]] and [[lead: {...}]] out of a reply.
function parseReply(text) {
  var out = {text: text, options: [], progress: null, lead: null};
  out.text = out.text.replace(/\[\[options:\s*([^\]]*)\]\]/i, function (m, o) {
    out.options = o.split('|').map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 8); return '';
  });
  out.text = out.text.replace(/\[\[progress:\s*(\d+)\s*\]\]/i, function (m, n) { out.progress = Math.max(0, Math.min(100, +n)); return ''; });
  out.text = out.text.replace(/\[\[lead:\s*(\{[\s\S]*?\})\s*\]\]/i, function (m, j) { try { out.lead = JSON.parse(j); } catch (e) {} return ''; });
  out.text = out.text.replace(/[–—]/g, ',').trim();
  return out;
}

function Card(p) {
  return (
    <div style={{width: '100%', maxWidth: CTX.embedded ? 640 : 540, background: '#fff', borderRadius: CTX.embedded ? 16 : 22, boxShadow: CTX.embedded ? '0 4px 28px rgba(8,58,70,.12)' : '0 20px 70px rgba(8,58,70,.32)', overflow: 'hidden', display: 'flex', flexDirection: 'column', animation: 'fadeIn .3s ease', border: CTX.embedded ? '1px solid #d4e4e6' : 'none'}}>
      {CTX.lender && <div style={{height: 5, background: ACC}} />}
      {p.children}
    </div>
  );
}

function App() {
  var L = CTX.lender;
  var needsType = !CTX.type && (!L || L.lends === 'both');
  var _s = useState('start'), stage = _s[0], setStage = _s[1];
  var _m = useState([]), msgs = _m[0], setMsgs = _m[1];
  var _h = useState([]), hist = _h[0], setHist = _h[1];
  var _i = useState(''), input = _i[0], setInput = _i[1];
  var _b = useState(false), busy = _b[0], setBusy = _b[1];
  var _r = useState(null), result = _r[0], setResult = _r[1];
  var _c = useState(false), consent = _c[0], setConsent = _c[1];
  var _t = useState(CTX.type), mtype = _t[0], setMtype = _t[1];
  var _o = useState([]), options = _o[0], setOptions = _o[1];
  var _p = useState(0), progress = _p[0], setProgress = _p[1];
  var endRef = useRef(null), inputRef = useRef(null), sysRef = useRef('');

  useEffect(function () { if (endRef.current) endRef.current.scrollIntoView({behavior: 'smooth', block: 'nearest'}); }, [msgs, busy, options]);

  function callAPI(history) {
    return fetch('/.netlify/functions/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({model: window.PP_MODEL, max_tokens: 700, system: sysRef.current, messages: history})
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (d.error) throw new Error(d.error.message);
      return (d.content && d.content[0] && d.content[0].text) || '';
    });
  }

  function handleReply(reply, baseHist, baseMsgs) {
    if (reply.indexOf('"complete"') !== -1) {
      try {
        var parsed = JSON.parse(reply.substring(reply.indexOf('{'), reply.lastIndexOf('}') + 1));
        if (parsed.complete && parsed.data) {
          parsed.data.mortgageType = parsed.data.mortgageType || mtype;
          if (L && !parsed.data.lender) parsed.data.lender = L.name;
          window.ppSend('complete', parsed.data);
          setResult(parsed.data); setStage('done'); setBusy(false); return;
        }
      } catch (e) {}
    }
    var p = parseReply(reply);
    if (p.lead) window.ppSend('lead', Object.assign({mortgageType: mtype || '', lender: L ? L.name : ''}, p.lead));
    if (p.progress !== null) setProgress(p.progress);
    setOptions(p.options);
    setHist(baseHist.concat([{role: 'assistant', content: reply}]));
    setMsgs(baseMsgs.concat([{role: 'assistant', content: p.text}]));
    setBusy(false);
    setTimeout(function () { if (inputRef.current) inputRef.current.focus(); }, 120);
  }

  function startChat() {
    sysRef.current = window.ppBuildSystem(mtype);
    setStage('chat'); setBusy(true);
    var first = {role: 'user', content: 'The client has opened the chat' + (L ? ' on the ' + L.name + ' page' : '') + '. Give a one-line warm welcome from Pinpoint Finance, say it takes about 3 minutes, and ask for their first name.'};
    callAPI([first]).then(function (reply) { handleReply(reply, [first], []); }).catch(function () {
      setMsgs([{role: 'assistant', content: 'Hi, welcome to Pinpoint Finance. This takes about 3 minutes. What\'s your first name?'}]);
      setHist([first, {role: 'assistant', content: 'Hi, welcome to Pinpoint Finance. What\'s your first name?'}]);
      setBusy(false);
    });
  }

  function send(textIn) {
    var txt = (textIn !== undefined ? textIn : input).trim();
    if (!txt || busy) return;
    setInput(''); setOptions([]);
    var newMsgs = msgs.concat([{role: 'user', content: txt}]);
    var newHist = hist.concat([{role: 'user', content: txt}]);
    setMsgs(newMsgs); setBusy(true);
    callAPI(newHist).then(function (reply) { handleReply(reply, newHist, newMsgs); }).catch(function () {
      setMsgs(newMsgs.concat([{role: 'assistant', content: 'Sorry, I lost connection for a moment. Please try that again, or call us on 01904 866 100.'}]));
      setBusy(false);
    });
  }

  var title = L ? (L.name + ' ' + L.pt + ' check') : 'Product transfer check';

  // ── START ─────────────────────────────────────────────
  if (stage === 'start') {
    var canStart = consent && (!needsType || mtype);
    return (
      <Card>
        <div style={{background: N, padding: '24px 24px 20px'}}>
          <div style={{display: 'flex', alignItems: 'center', gap: 14}}>
            <Logo sz={52} />
            <div>
              <div style={{fontSize: 10, textTransform: 'uppercase', letterSpacing: '2.5px', color: T, fontWeight: 700, marginBottom: 5}}>Pinpoint Finance</div>
              <div style={{fontSize: 21, fontWeight: 900, color: '#fff', lineHeight: 1.2, textTransform: 'capitalize'}}>{title}</div>
            </div>
          </div>
          <div style={{display: 'flex', gap: 8, flexWrap: 'wrap', marginTop: 16}}>
            {['About 3 minutes', 'No broker fee on a straight switch', 'FCA regulated'].map(function (x) {
              return <span key={x} style={{fontSize: 11, fontWeight: 700, color: '#fff', background: 'rgba(255,255,255,.1)', border: '1px solid rgba(255,255,255,.18)', borderRadius: 20, padding: '5px 10px'}}>&#10003; {x}</span>;
            })}
          </div>
        </div>
        <div style={{padding: '20px 24px 24px'}}>
          {needsType && (
            <div style={{marginBottom: 18}}>
              <div style={{fontSize: 13, fontWeight: 700, color: N, marginBottom: 10}}>Is the mortgage on…</div>
              <div style={{display: 'flex', gap: 10}}>
                <button className={'typebtn' + (mtype === 'residential' ? ' on' : '')} onClick={function () { setMtype('residential'); }}>Your home<small>Residential</small></button>
                <button className={'typebtn' + (mtype === 'buy-to-let' ? ' on' : '')} onClick={function () { setMtype('buy-to-let'); }}>A property you let<small>Buy to let</small></button>
              </div>
            </div>
          )}
          <div style={{background: C, borderRadius: 12, padding: '13px 15px', marginBottom: 14, fontSize: 13, color: M, lineHeight: 1.7}}>
            We'll ask for your contact details first, so we can still help if you need to stop. Your data is held securely under UK GDPR and never sold.
          </div>
          <label style={{display: 'flex', alignItems: 'flex-start', gap: 11, cursor: 'pointer', marginBottom: 18, fontSize: 13, color: M, lineHeight: 1.6}}>
            <input type="checkbox" checked={consent} onChange={function () { setConsent(!consent); }} style={{width: 20, height: 20, marginTop: 1, accentColor: N, flexShrink: 0}} />
            <span>I agree to Pinpoint Finance using my details to look at my mortgage options and contact me about them.</span>
          </label>
          <button disabled={!canStart} onClick={startChat} style={{width: '100%', padding: 15, borderRadius: 12, border: 'none', background: canStart ? T : '#e2e8f0', color: canStart ? N : '#999', fontSize: 15, fontWeight: 900, cursor: canStart ? 'pointer' : 'default', fontFamily: 'Lato,sans-serif'}}>
            {canStart ? 'Start my free check →' : (needsType && !mtype ? 'Choose home or let property above' : 'Tick the box above to start')}
          </button>
          <div style={{textAlign: 'center', marginTop: 11, fontSize: 11, color: '#8aa5aa'}}>FCA ref 733225 &middot; NACFB member 23362 &middot; York based team</div>
        </div>
      </Card>
    );
  }

  // ── CHAT ──────────────────────────────────────────────
  if (stage === 'chat') {
    return (
      <Card>
        <div style={{background: N, padding: '12px 16px', display: 'flex', alignItems: 'center', gap: 11}}>
          <Logo sz={34} />
          <div style={{flex: 1, minWidth: 0}}>
            <div style={{fontWeight: 900, color: '#fff', fontSize: 14, textTransform: 'capitalize'}}>{title}</div>
            <div style={{fontSize: 10, color: 'rgba(255,255,255,.6)', letterSpacing: '.8px', textTransform: 'uppercase'}}>{mtype ? (mtype === 'residential' ? 'Residential' : 'Buy to let') + ' · ' : ''}AI assistant · adviser reviewed</div>
          </div>
        </div>
        <div style={{height: 4, background: '#e6eef0'}}><div style={{height: 4, width: Math.max(4, progress) + '%', background: ACC, transition: 'width .5s ease'}} /></div>
        <div style={{flex: 1, overflowY: 'auto', padding: '16px 14px', display: 'flex', flexDirection: 'column', gap: 11, minHeight: 360, maxHeight: CTX.embedded ? 460 : 500}}>
          {msgs.map(function (m, i) {
            var u = m.role === 'user';
            return (
              <div key={i} style={{display: 'flex', justifyContent: u ? 'flex-end' : 'flex-start', alignItems: 'flex-end', gap: 8, animation: 'fadeIn .2s ease'}}>
                {!u && <Logo sz={26} />}
                <div style={{maxWidth: '82%', padding: '11px 14px', borderRadius: u ? '16px 16px 4px 16px' : '16px 16px 16px 4px', background: u ? N : C, color: u ? '#fff' : N, fontSize: 14, lineHeight: 1.65, whiteSpace: 'pre-wrap', wordBreak: 'break-word'}}>{m.content}</div>
              </div>
            );
          })}
          {busy && (
            <div style={{display: 'flex', alignItems: 'flex-end', gap: 8}}>
              <Logo sz={26} />
              <div style={{padding: '13px 15px', background: C, borderRadius: '16px 16px 16px 4px', display: 'flex', gap: 5}}>
                {[0, 1, 2].map(function (i) { return <div key={i} style={{width: 7, height: 7, borderRadius: '50%', background: T, animation: 'bounce 1.2s infinite', animationDelay: (i * .18) + 's'}} />; })}
              </div>
            </div>
          )}
          {!busy && options.length > 0 && (
            <div style={{display: 'flex', flexWrap: 'wrap', gap: 7, paddingLeft: 34}}>
              {options.map(function (o) { return <button key={o} className="chip" onClick={function () { send(o); }}>{o}</button>; })}
            </div>
          )}
          <div ref={endRef} />
        </div>
        <div style={{padding: '10px 12px 12px', borderTop: '1px solid #e6eef0'}}>
          <div style={{display: 'flex', gap: 8}}>
            <input ref={inputRef} value={input} disabled={busy} onChange={function (e) { setInput(e.target.value); }}
              onKeyDown={function (e) { if (e.key === 'Enter') { e.preventDefault(); send(); } }}
              placeholder={options.length ? 'Tap an answer or type here' : 'Type your answer'}
              style={{flex: 1, padding: '12px 14px', border: '2px solid #d4e4e6', borderRadius: 12, fontSize: 15, color: N, fontFamily: 'Lato,sans-serif', outline: 'none'}} />
            <button onClick={function () { send(); }} disabled={!input.trim() || busy} aria-label="Send"
              style={{width: 46, height: 46, borderRadius: 12, border: 'none', background: (input.trim() && !busy) ? T : '#e2e8f0', color: N, fontSize: 20, fontWeight: 900, cursor: 'pointer'}}>&#8593;</button>
          </div>
          <div style={{fontSize: 10, color: '#9bb3b7', textAlign: 'center', marginTop: 7}}>Prefer to talk? Call 01904 866 100 &middot; FCA ref 733225</div>
        </div>
      </Card>
    );
  }

  if (stage === 'done' && result) {
    var remo = (result.path || '').toLowerCase().indexOf('remortgage') !== -1;
    var rows = [['Name', [result.firstName, result.lastName].join(' ').trim()], ['Phone', result.phone], ['Email', result.email],
      ['Address', [result.address, result.postcode].filter(Boolean).join(', ')], ['Lender', result.lender], ['Mortgage', result.mortgageType],
      ['Deal ends', result.dealExpiry], ['Balance', result.balance], ['Property value', result.propertyValue], ['Account number', result.accountNumber],
      ['Route', result.path === 'PT_ONLY' ? 'Switch with current lender' : (remo ? 'Full market review requested' : result.path)],
      ['Joint with', result.jointName], ['Planned changes', result.plannedChanges], ['Preference', result.productType],
      ['Monthly budget', result.maxPayment], ['Monthly rent', result.rentalIncome], ['Let property', result.btlAddress]
    ].filter(function (r) { return r[1] && String(r[1]).trim(); });
    return (
      <Card>
        <div style={{background: N, padding: '28px 24px', textAlign: 'center'}}>
          <div style={{width: 56, height: 56, borderRadius: '50%', background: 'rgba(26,178,177,.2)', border: '2px solid ' + T, display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 14px', fontSize: 24, color: T}}>&#10003;</div>
          <div style={{fontSize: 22, fontWeight: 900, color: '#fff', marginBottom: 8}}>Thanks{result.firstName ? ', ' + result.firstName : ''}</div>
          <div style={{fontSize: 13, color: 'rgba(255,255,255,.75)', lineHeight: 1.7}}>
            {remo ? 'An adviser will be in touch within one working day about your full market review, including the £495 fee, before you decide.' : 'We\'ll get your ' + (L ? L.name + ' ' + L.pt : 'switch') + ' options ready and be in touch within one working day.'}
          </div>
        </div>
        <div style={{padding: '18px 24px 22px'}}>
          <div style={{fontSize: 10, fontWeight: 700, color: T, textTransform: 'uppercase', letterSpacing: '2px', marginBottom: 10}}>What you told us</div>
          {rows.map(function (r) {
            return <div key={r[0]} style={{display: 'flex', justifyContent: 'space-between', gap: 12, padding: '7px 0', borderBottom: '1px solid #f0ede6', fontSize: 13}}><span style={{color: M}}>{r[0]}</span><span style={{color: N, fontWeight: 700, textAlign: 'right', wordBreak: 'break-word'}}>{r[1]}</span></div>;
          })}
          <div style={{marginTop: 16, fontSize: 12, color: M, lineHeight: 1.6}}>Anything wrong? Call 01904 866 100 or email hello@pinpoint.finance.</div>
        </div>
      </Card>
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
